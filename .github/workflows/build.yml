name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-vst3:
    runs-on: self-hosted
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --clean-first --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VST-Engine-Windows-VST3
          path: build/VstEngine_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
